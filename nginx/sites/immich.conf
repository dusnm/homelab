# Copy to /etc/nginx/sites-available/immich.conf, then:
#   sudo ln -s /etc/nginx/sites-available/immich.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
upstream immich {
	server 127.0.0.1:2283;  # container listens on IPv4 loopback only
}

server {
	server_name ${HOST_PHOTOS};

	access_log off;

	# large photo/video uploads from the mobile app (Immich recommends this)
	client_max_body_size 50000M;

	location / {
		proxy_pass http://immich;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Protocol $scheme;
		proxy_set_header X-Forwarded-Host $http_host;

		# websockets (live updates in the web app)
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_redirect off;

		# stream uploads and downloads instead of buffering them
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
		send_timeout 600s;
	}

	listen [::]:443 ssl;
	listen 443 ssl;
	ssl_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/fullchain.pem;
	ssl_certificate_key ${LETSENCRYPT_DIR}/live/${DOMAIN}/privkey.pem;
	include ${LETSENCRYPT_DIR}/options-ssl-nginx.conf;
	ssl_dhparam ${LETSENCRYPT_DIR}/ssl-dhparams.pem;
}

server {
	server_name ${HOST_PHOTOS};

	listen 80;
	listen [::]:80;

	return 301 https://$host$request_uri;
}
