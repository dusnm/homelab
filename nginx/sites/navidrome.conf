# Navidrome: https://${HOST_MUSIC} (public; Navidrome's own login, not Authelia,
# so Subsonic mobile apps work). Copy to /etc/nginx/sites-available/navidrome.conf and enable it.

# Extra brute-force limit on the web login, per client IP (Navidrome also limits it itself).
limit_req_zone $binary_remote_addr zone=navidrome_auth:1m rate=10r/m;

server {
	server_name ${HOST_MUSIC};
	access_log off;

	location /auth/ {
		limit_req zone=navidrome_auth burst=5 nodelay;
		limit_req_status 429;
		proxy_pass http://127.0.0.1:4533;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		proxy_pass http://127.0.0.1:4533;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_buffering off;          # streaming
		proxy_read_timeout 1h;
	}

	listen [::]:443 ssl;
	listen 443 ssl;
	ssl_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/fullchain.pem;
	ssl_certificate_key ${LETSENCRYPT_DIR}/live/${DOMAIN}/privkey.pem;
	include ${LETSENCRYPT_DIR}/options-ssl-nginx.conf;
	ssl_dhparam ${LETSENCRYPT_DIR}/ssl-dhparams.pem;
}

server {
	server_name ${HOST_MUSIC};
	listen 80;
	listen [::]:80;
	return 301 https://$host$request_uri;
}
