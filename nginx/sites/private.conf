# Private apps on subdomains of DOMAIN, protected by Authelia (2FA).
# Self-contained: each block proxies straight to the app's port on 127.0.0.1, so this
# file has no dependencies on other site files.
# To protect another app: copy a block, change the name and port, and add the domain to
# access_control in Authelia's configuration.yml (default_policy is deny).

server {
	server_name ${HOST_HOME};
	access_log off;

	include /etc/nginx/snippets/authelia-location.conf;

	location / {
		include /etc/nginx/snippets/authelia-authrequest.conf;
		proxy_pass http://127.0.0.1:5678/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Protocol $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_buffering off;
	}

	listen [::]:443 ssl;
	listen 443 ssl;
	ssl_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/fullchain.pem;
	ssl_certificate_key ${LETSENCRYPT_DIR}/live/${DOMAIN}/privkey.pem;
	include ${LETSENCRYPT_DIR}/options-ssl-nginx.conf;
	ssl_dhparam ${LETSENCRYPT_DIR}/ssl-dhparams.pem;
}

server {
	server_name ${HOST_HOME};
	listen 80;
	listen [::]:80;
	return 301 https://$host$request_uri;
}

server {
	server_name ${HOST_SLSKD};
	access_log off;

	include /etc/nginx/snippets/authelia-location.conf;

	location / {
		include /etc/nginx/snippets/authelia-authrequest.conf;
		proxy_pass http://127.0.0.1:5030/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Protocol $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_request_buffering off;
		proxy_buffering off;
	}

	listen [::]:443 ssl;
	listen 443 ssl;
	ssl_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/fullchain.pem;
	ssl_certificate_key ${LETSENCRYPT_DIR}/live/${DOMAIN}/privkey.pem;
	include ${LETSENCRYPT_DIR}/options-ssl-nginx.conf;
	ssl_dhparam ${LETSENCRYPT_DIR}/ssl-dhparams.pem;
}

server {
	server_name ${HOST_SLSKD};
	listen 80;
	listen [::]:80;
	return 301 https://$host$request_uri;
}

