upstream adguard {
	server 127.0.0.1:3070;
}

server {
	server_name ${HOST_DNS};

	access_log /var/log/nginx/adguard.log;

	location / {
		proxy_pass http://adguard/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Protocol $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_buffering off;
	}

	listen [::]:443 ssl http2;
	listen 443 ssl http2;

	ssl_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/fullchain.pem;
	ssl_certificate_key ${LETSENCRYPT_DIR}/live/${DOMAIN}/privkey.pem;
	include ${LETSENCRYPT_DIR}/options-ssl-nginx.conf;
    	ssl_dhparam ${LETSENCRYPT_DIR}/ssl-dhparams.pem;
    	add_header Strict-Transport-Security "max-age=31536000" always;
    	ssl_trusted_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/chain.pem;

    	add_header X-Frame-Options "SAMEORIGIN";
    	add_header X-XSS-Protection "0"; # Do NOT enable. This is obsolete/dangerous
    	add_header X-Content-Type-Options "nosniff";

	add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), battery=(), bluetooth=(), camera=(), clipboard-read=(), display-capture=(), document-domain=(), encrypted-media=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), keyboard-map=(), local-fonts=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;

    	add_header Origin-Agent-Cluster "?1" always;
}


server {
	if ($host = ${HOST_DNS}) {
		return 301 https://$host$request_uri;
	}

	server_name ${HOST_DNS};

	listen 80;
	listen [::]:80;

	return 404;
}
