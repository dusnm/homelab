# -------------------------------------------------------------
# Upstreams
# -------------------------------------------------------------
upstream hasura_upstream {
    server 127.0.0.1:3012;
    keepalive 32;
}

upstream auth_upstream {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream client_upstream {
    server 127.0.0.1:3011;
    keepalive 16;
}

# -------------------------------------------------------------
# Server
# -------------------------------------------------------------
server {
    # HTTP/3 QUIC listener
    listen 443 ssl http2;

    server_name ${HOST_MACROS};

    # TLS config
    ssl_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key ${LETSENCRYPT_DIR}/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ---------------------------------------------------------
    # Global security headers
    # ---------------------------------------------------------
    add_header Referrer-Policy "strict-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains;";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "0";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://apis.google.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' *.ingest.sentry.io https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://apis.google.com https://world.openfoodfacts.org; frame-src 'self' *.firebaseapp.com https://www.google.com; img-src 'self' https://www.gstatic.com data:; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; worker-src 'self'; object-src 'none';";
    add_header Permissions-Policy "accelerometer=(self), autoplay=(self), camera=(self), cross-origin-isolated=(self), display-capture=(self), encrypted-media=(self), fullscreen=(self), geolocation=(self), gyroscope=(self), keyboard-map=(self), magnetometer=(self), microphone=(self), midi=(self), payment=(self), picture-in-picture=(self), publickey-credentials-get=(self), screen-wake-lock=(self), sync-xhr=(self), usb=(self), xr-spatial-tracking=(self)";

    # ---------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xhtml+xml
        application/rss+xml
        application/atom+xml
        application/ld+json
        text/css
        text/javascript
        text/plain
        text/xml
        font/woff2
        font/woff;

    # ---------------------------------------------------------
    # Static asset caching
    # ---------------------------------------------------------
    location ~* \.(css|js|mjs|json|ico|webp|jpg|jpeg|png|svg|gif|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        proxy_pass http://client_upstream;
        proxy_set_header X-Hasura-Role "";
	proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---------------------------------------------------------
    # /console* → Hasura (CSP disabled)
    # ---------------------------------------------------------
    location ^~ /console {
        add_header Content-Security-Policy "";
        proxy_pass http://hasura_upstream;
        proxy_set_header X-Hasura-Role "";
	proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---------------------------------------------------------
    # /v1*, /v2*, /healthz → Hasura
    # ---------------------------------------------------------
    location ^~ /v1 {
        proxy_pass http://hasura_upstream;
        proxy_set_header X-Hasura-Role "";
	proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /v2 {
        proxy_pass http://hasura_upstream;
        proxy_set_header X-Hasura-Role "";
	proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /healthz {
        proxy_pass http://hasura_upstream;
        proxy_set_header X-Hasura-Role "";
	proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---------------------------------------------------------
    # /auth* → auth server
    # ---------------------------------------------------------
    location ^~ /auth {
        proxy_pass http://auth_upstream;
        proxy_set_header X-Hasura-Role "";
	proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---------------------------------------------------------
    # Default → client app
    # ---------------------------------------------------------
    location / {
        proxy_pass http://client_upstream;
        proxy_set_header X-Hasura-Role "";
	proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
        if ($host = ${HOST_MACROS}) {
                return 301 https://$host$request_uri;
        }

        server_name ${HOST_MACROS};

        listen 80;
        listen [::]:80;

        return 404;
}
