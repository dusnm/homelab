# Refuse HTTPS for any hostname no other site serves (unknown names, raw IP),
# instead of falling through to whichever site nginx happens to load first.
# Plain-HTTP unknown names are handled by the "default" site.
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;
	ssl_reject_handshake on;
}
