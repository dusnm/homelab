# Vikunja: https://${HOST_TASKS} (public; Vikunja's own login + TOTP, rate-limited)
# Copy to /etc/nginx/sites-available/vikunja.conf and enable it.
server {
	server_name ${HOST_TASKS};
	access_log off;

	# attachments (VIKUNJA_FILES_MAXSIZE is 20MB)
	client_max_body_size 20m;

	location / {
		proxy_pass http://127.0.0.1:8080/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_buffering off;
	}

	listen [::]:443 ssl;
	listen 443 ssl;
	ssl_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/fullchain.pem;
	ssl_certificate_key ${LETSENCRYPT_DIR}/live/${DOMAIN}/privkey.pem;
	include ${LETSENCRYPT_DIR}/options-ssl-nginx.conf;
	ssl_dhparam ${LETSENCRYPT_DIR}/ssl-dhparams.pem;
}

server {
	server_name ${HOST_TASKS};
	listen 80;
	listen [::]:80;
	return 301 https://$host$request_uri;
}
