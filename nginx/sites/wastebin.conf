upstream wastebin {
	server localhost:8088;
}

server {
	server_name ${HOST_PASTE};

	access_log off;

	location / {
		proxy_pass http://wastebin/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Protocol $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_buffering off;
	}

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/fullchain.pem; # managed by Certbot
    ssl_certificate_key ${LETSENCRYPT_DIR}/live/${DOMAIN}/privkey.pem; # managed by Certbot
    include ${LETSENCRYPT_DIR}/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam ${LETSENCRYPT_DIR}/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = ${HOST_PASTE}) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	server_name ${HOST_PASTE};

	listen 80;
	listen [::]:80;
    return 404; # managed by Certbot


}
