# Copy to /etc/nginx/sites-available/paperless.conf, then:
#   sudo ln -s /etc/nginx/sites-available/paperless.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
upstream paperless {
	server 127.0.0.1:8010;  # container listens on IPv4 loopback only
}

server {
	server_name ${HOST_DOCS};

	access_log off;

	# scanned PDFs and photo uploads
	client_max_body_size 200m;

	location / {
		proxy_pass http://paperless/;
		proxy_http_version 1.1;
		# websockets: live upload/consume status
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Protocol $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_buffering off;
		proxy_read_timeout 300s;
	}

	listen [::]:443 ssl;
	listen 443 ssl;
	ssl_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/fullchain.pem;
	ssl_certificate_key ${LETSENCRYPT_DIR}/live/${DOMAIN}/privkey.pem;
	include ${LETSENCRYPT_DIR}/options-ssl-nginx.conf;
	ssl_dhparam ${LETSENCRYPT_DIR}/ssl-dhparams.pem;
}

server {
	server_name ${HOST_DOCS};

	listen 80;
	listen [::]:80;

	return 301 https://$host$request_uri;
}
