# Copy to /etc/nginx/sites-available/mealie.conf, then:
#   sudo ln -s /etc/nginx/sites-available/mealie.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
upstream mealie {
	server 127.0.0.1:9925;  # container listens on IPv4 loopback only
}

server {
	server_name ${HOST_RECIPES};

	access_log off;

	# recipe images, cookbook photo imports and backup uploads
	client_max_body_size 50m;

	location / {
		proxy_pass http://mealie/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Protocol $scheme;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_buffering off;
		# URL imports and AI parsing can take a while
		proxy_read_timeout 120s;
	}

	listen [::]:443 ssl;
	listen 443 ssl;
	ssl_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/fullchain.pem;
	ssl_certificate_key ${LETSENCRYPT_DIR}/live/${DOMAIN}/privkey.pem;
	include ${LETSENCRYPT_DIR}/options-ssl-nginx.conf;
	ssl_dhparam ${LETSENCRYPT_DIR}/ssl-dhparams.pem;
}

server {
	server_name ${HOST_RECIPES};

	listen 80;
	listen [::]:80;

	return 301 https://$host$request_uri;
}
