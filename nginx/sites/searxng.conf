upstream searxng {
	server localhost:10200;
}

server {
	server_name ${HOST_SEARCH};

	access_log /var/log/nginx/searxng-access.log;
	error_log /var/log/nginx/searxng-error.log error;

	location / {
		proxy_pass http://searxng/;
		proxy_set_header Host $host;
		proxy_set_header Connection $http_connection;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Scheme $scheme;
		proxy_set_header X-Script-Name /searxng;
		proxy_buffering off;
	}

	listen [::]:443 ssl http2;
	listen 443 ssl http2;
	ssl_certificate ${LETSENCRYPT_DIR}/live/${DOMAIN}/fullchain.pem;
	ssl_certificate_key ${LETSENCRYPT_DIR}/live/${DOMAIN}/privkey.pem;
}


server {
	if ($host = ${HOST_SEARCH}) {
		return 301 https://$host$request_uri;
	}

	server_name ${HOST_SEARCH};

	listen 80;
	listen [::]:80;

	return 404;
}
