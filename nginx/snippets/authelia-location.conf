## From Authelia's NGINX integration guide (v4.39), adapted for Authelia on 127.0.0.1:9091.
## Include once per protected server block (server level, not inside a location).
set $upstream_authelia http://127.0.0.1:9091/api/authz/auth-request;

## Virtual endpoint created by nginx to forward auth requests.
location /internal/authelia/authz {
    internal;
    proxy_pass $upstream_authelia;

    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length "";
    ## Don't pass the app's own Authorization header to Authelia. Apps like Beszel send
    ## "Authorization: <token>" on their API calls; Authelia tries to parse it and returns 401.
    ## Every protected site is two_factor, so header (basic) auth to Authelia is never usable anyway.
    proxy_set_header Authorization "";
    proxy_set_header Proxy-Authorization "";
    proxy_set_header Connection "";

    proxy_pass_request_body off;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    proxy_redirect http:// $scheme://;
    proxy_http_version 1.1;
    proxy_cache_bypass $cookie_session;
    proxy_no_cache $cookie_session;
    proxy_buffers 4 32k;
    client_body_buffer_size 128k;

    send_timeout 5m;
    proxy_read_timeout 240;
    proxy_send_timeout 240;
    proxy_connect_timeout 240;
}
