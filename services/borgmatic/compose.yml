# borgmatic: encrypted, deduplicated backups (e.g. to BorgBase) with consistent database dumps.
# Config and schedule: $DATA_ROOT/borgmatic/config (start from config.yaml.example and
# crontab.txt.example); secrets: $DATA_ROOT/borgmatic/.env. What to back up is mounted by
# $DATA_ROOT/borgmatic/compose.override.yml (start from compose.override.yml.example).
services:
  borgmatic:
    image: ghcr.io/borgmatic-collective/borgmatic:2.2.0
    container_name: borgmatic
    hostname: ${BACKUP_HOSTNAME:-homelab}
    restart: unless-stopped
    env_file: ${DATA_ROOT}/borgmatic/.env
    environment:
      TZ: ${TZ}
      DATA_ROOT: ${DATA_ROOT}           # for config.yaml (borgmatic expands ${...} in it)
      MEDIA_ROOT: ${MEDIA_ROOT}
      NEXTCLOUD_ROOT: ${NEXTCLOUD_ROOT}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - ${DATA_ROOT}/borgmatic/config:/etc/borgmatic.d:ro
      - ${DATA_ROOT}/borgmatic/ssh:/root/.ssh
      - ${DATA_ROOT}/borgmatic/borg-config:/root/.config/borg   # borg security dir + exported repo key
      - ${DATA_ROOT}/borgmatic/cache:/root/.cache/borg
      - ${DATA_ROOT}/borgmatic/state:/root/.local/state/borgmatic
      - ${DATA_ROOT}/borgmatic/restore:/restore                 # target for restores
      - /var/lib/docker/volumes/paperless_data:/var/lib/docker/volumes/paperless_data:ro
      - /var/lib/docker/volumes/paperless_media:/var/lib/docker/volumes/paperless_media:ro
      - /etc:/host/etc:ro
    networks: [immich, paperless, cleanslate, nextcloud]   # to dump their databases
networks:
  immich:     {external: true, name: immich_default}
  paperless:  {external: true, name: paperless_default}
  cleanslate: {external: true, name: cleanslate_default}
  nextcloud:  {external: true, name: nextcloud_default}
