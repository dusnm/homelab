# MeTube (yt-dlp web UI). Behind nginx + Authelia.
services:
  metube:
    image: ghcr.io/alexta69/metube
    container_name: metube
    restart: unless-stopped
    environment:
      - UID=${PUID}
      - GID=${PGID}
      - UMASK=022
      - DEFAULT_THEME=dark
      - LOGLEVEL=INFO
      - DOWNLOAD_MODE=limited
      - MAX_CONCURRENT_DOWNLOADS=5
      - DELETE_FILE_ON_TRASHCAN=true
    ports:
      - "127.0.0.1:8081:8081"
