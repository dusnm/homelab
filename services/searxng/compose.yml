# SearXNG (metasearch) with Valkey. settings.yml: $DATA_ROOT/searxng/data (start from
# settings.yml.example; set your own secret_key).
services:
  searxng:
    container_name: searx
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - searx
    ports:
      - "127.0.0.1:10200:8080"
    volumes:
      - ${DATA_ROOT}/searxng/data:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${HOST_SEARCH}
      - UWSGI_WORKERS=${SEARXNG_UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    user: 977:977
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
  redis:
    container_name: searx-valkey
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    networks:
      - searx
    volumes:
      - "valkey:/data"
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
networks:
  searx:
volumes:
  valkey:
