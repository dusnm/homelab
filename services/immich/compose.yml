# Immich (photos). Settings and DB password: $DATA_ROOT/immich/.env (see .env.example).
# Hardware acceleration and extra (external) libraries are machine-specific: see
# compose.override.yml.example.
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    volumes:
      - ${DATA_ROOT}/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ${DATA_ROOT}/immich/.env
    ports:
      - '127.0.0.1:2283:2283'   # only reachable through nginx
    depends_on:
      - redis
      - database
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      disable: false
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    volumes:
      - model-cache:/cache
    env_file:
      - ${DATA_ROOT}/immich/.env
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      disable: false
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "false"
  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DATA_ROOT}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      disable: false
volumes:
  model-cache:
